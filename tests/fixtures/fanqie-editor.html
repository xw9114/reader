<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>番茄编辑器测试页</title>
    <style>
      body { margin: 40px; font-family: sans-serif; }
      .field { margin-bottom: 24px; }
      input { height: 44px; padding: 0 12px; }
      .chapter-heading { display: flex; align-items: center; gap: 10px; width: 720px; }
      #chapter-number { width: 72px; text-align: center; }
      #chapter-title { width: 560px; }
      .chapter-editor { width: 680px; min-height: 360px; padding: 20px; border: 1px solid #ccc; white-space: pre-wrap; }
      .plain-box { width: 680px; }
      #platform-message { width: 680px; min-height: 80px; padding: 12px; border: 1px solid #ddd; }
    </style>
  </head>
  <body>
    <div class="field chapter-heading">
      <span>第</span>
      <input id="chapter-number" type="text" inputmode="numeric" maxlength="6" aria-label="章节序号">
      <span>章</span>
      <label for="chapter-title">章节标题</label>
      <input id="chapter-title" maxlength="50" placeholder="请输入章节标题">
    </div>
    <div class="field">
      <p>章节正文</p>
      <div class="chapter-editor" contenteditable="true" data-placeholder="请输入正文"></div>
    </div>
    <section class="plain-box">
      <header><strong>作者有话说</strong></header>
      <div class="input-shell"><div id="platform-message" contenteditable="" aria-multiline="true" data-limit="300"></div></div>
      <span>0/300</span>
      <button id="publish-button" type="button">发布</button>
    </section>
    <script>
      window.__READER_TEST_PATHNAME__ = "/main/writer/123/publish/456";
      window.__READER_TEST_LIBRARY__ = {
        latestStoryId: "story-1",
        storyCount: 1,
        stories: [{
          id: "story-1",
          title: "测试作品",
          date: "2026-09-24",
          chapters: [{
            id: "chapter-1",
            title: "第1章 测试",
            body: "第一段。\n\n第二段。",
            interaction: "今天不聊剧情，你们是更新就看，还是喜欢攒几章？",
            characters: 8
          }]
        }]
      };
      window.__FANQIE_PUBLISH_CLICKS__ = 0;
      document.querySelector("#publish-button").addEventListener("click", () => { window.__FANQIE_PUBLISH_CLICKS__ += 1; });
    </script>
    <script src="../../extension/content.js"></script>
  </body>
</html>
